<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ texts.subject }}</title>
</head>
<!-- Inline styles and a table: what email clients render the same way. -->
<body style="margin:0;padding:0;background:#f6f3ee;font-family:Arial,Helvetica,sans-serif;color:#1f1f1f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ee;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;">
<tr><td style="padding:32px;font-size:16px;line-height:24px;">
<p style="margin:0 0 16px;">{{ hello }}</p>
<p style="margin:0 0 16px;">{{ texts.ready }}</p>
{% for label, value in facts %}
<p style="margin:0 0 4px;"><strong>{{ label }}</strong>{{ separator }}{{ value }}</p>
{% endfor %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
<tr><td style="border-radius:6px;background:#1f3d36;">
<a href="{{ quote_url }}" style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-weight:bold;">{{ texts.button }}</a>
</td></tr>
</table>
<p style="margin:0 0 4px;font-size:13px;color:#5c5c5c;">{{ texts.fallback }}</p>
<p style="margin:0 0 24px;font-size:13px;word-break:break-all;"><a href="{{ quote_url }}" style="color:#1f3d36;">{{ quote_url }}</a></p>
<p style="margin:0;">{{ texts.signature }}</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
