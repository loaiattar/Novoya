[project]
name = "novoya-api"
version = "0.1.0"
description = "Novoya backend: REST API, agent orchestrator and workers"
readme = "README.md"
authors = [
    { name = "Loai Elattar", email = "loaiattar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "babel>=2.18.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "joserfc>=1.7.5",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
