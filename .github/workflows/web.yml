name: Web

on:
  pull_request:
    branches: [main, dev]
    paths: ["apps/web/**", "apps/api/openapi.json", ".github/workflows/web.yml"]
  push:
    branches: [main, dev]
    paths: ["apps/web/**", "apps/api/openapi.json", ".github/workflows/web.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
